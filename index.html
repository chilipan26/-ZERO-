<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>請求書チェック</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
--ink:       #1c1c1c;
--ink-sub:   #6e6e6e;
--surface:   #ffffff;
--bg:        #f0f0ef;
--line:      #dcdcdc;
--accent:    #333333;
--ok:        #2ec4b6;
--ng:        #e63946;
--radius:    10px;
}

html, body {
background: var(--bg);
color: var(--ink);
font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
font-size: 14px;
min-height: 100vh;
-webkit-tap-highlight-color: transparent;
}

main { padding: 10px 8px 32px; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

.sticky-header {
position: sticky; top: 0; z-index: 20;
background: var(--bg);
padding-top: 10px; padding-bottom: 6px;
display: flex; flex-direction: column; gap: 8px;
margin: -10px -8px 0; padding-left: 8px; padding-right: 8px;
}

.top-bar {
padding: 4px 2px;
display: flex;
justify-content: space-between;
align-items: center;
gap: 8px;
font-size: 12px;
font-weight: 600;
color: var(--ink-sub);
}
.top-bar .num { color: var(--ink); font-weight: 700; }
.top-bar .user-name { color: var(--ink-sub); font-weight: 700; white-space: nowrap; }
.month-select {
font-size: 13px; font-weight: 700; padding: 8px 10px;
border-radius: 6px; border: 1px solid var(--line);
background: var(--surface); color: var(--ink);
flex: 1 1 auto; max-width: 140px;
}

.filter-split { display: flex; gap: 6px; }
.seg-group {
flex: 1; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
}
.seg-btn {
flex: 1; text-align: center; font-size: 11px; font-weight: 700; padding: 7px 2px;
background: var(--surface); color: var(--ink-sub); border: none; cursor: pointer;
white-space: nowrap;
}
.seg-btn.active { background: var(--ink); color: #fff; }
.seg-btn + .seg-btn { border-left: 1px solid var(--line); }

.bulk-check-btn {
width: 100%; padding: 9px; font-size: 12px; font-weight: 700;
border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
color: var(--ink-sub); cursor: pointer;
}

.day-row-wrap { display: flex; align-items: center; gap: 6px; }
.day-reset {
flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 14px; border: 1px solid var(--line); background: var(--surface);
color: var(--ink-sub); cursor: pointer;
}
.day-row { display: flex; flex-wrap: nowrap; gap: 5px; overflow-x: auto; padding-bottom: 2px; flex: 1; min-width: 0; }
.day-chip {
flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 10.5px; font-weight: 700;
border: 1px solid var(--line); background: var(--surface); color: var(--ink-sub);
cursor: pointer;
}
.day-chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }

.item-list {
display: flex; flex-direction: column; gap: 6px;
}

.item-card {
background: var(--surface);
border: 0.5px solid var(--line);
border-radius: 8px;
padding: 9px 10px 34px;
display: flex;
flex-direction: column;
gap: 6px;
position: relative;
}
.item-card.checked { background: #eef7f6; border-color: #bfe6e2; }
.item-main-row { display: flex; gap: 9px; align-items: flex-start; }

.item-checkbox {
width: 22px; height: 22px; flex: 0 0 22px;
border: 1.5px solid var(--line); border-radius: 6px;
background: var(--surface);
display: flex; align-items: center; justify-content: center;
font-size: 14px; color: transparent;
cursor: pointer; margin-top: 1px;
transition: all .1s;
}
.item-checkbox.checked { background: var(--ok); border-color: var(--ok); color: #fff; }

.edit-icon-btn {
position: absolute; left: 8px; bottom: 8px;
width: 26px; height: 26px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 12px; color: var(--ink-sub);
background: var(--surface); border: 1px solid var(--line); cursor: pointer;
}

.item-body { flex: 1; min-width: 0; }
.item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.item-project { font-size: 13px; font-weight: 700; color: var(--ink); }
.item-date { font-size: 11px; color: var(--ink-sub); font-weight: 600; margin-right: 6px; }
.item-amount { font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.item-tag {
font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 20px;
background: var(--line); color: var(--ink-sub); margin-right: 5px;
}
.item-cols { display: flex; gap: 14px; margin-top: 4px; }
.item-col { flex: 1; display: flex; flex-direction: column; gap: 1px; font-size: 11px; color: var(--ink-sub); min-width: 0; }
.item-col .v { color: var(--ink); font-weight: 600; }

.item-card.editing { flex-direction: column; align-items: stretch; }
.edit-grid {
display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; margin-bottom: 8px;
}
.edit-grid label { font-size: 10px; color: var(--ink-sub); font-weight: 600; display: block; }
.edit-grid input {
width: 100%; margin-top: 2px; padding: 6px 7px; font-size: 12px;
border: 1px solid var(--line); border-radius: 6px; font-family: inherit; color: var(--ink);
}
.edit-actions { display: flex; gap: 6px; }
.edit-actions button {
flex: 1; padding: 9px; font-size: 12px; font-weight: 700; border-radius: 7px; cursor: pointer;
}
.edit-cancel { background: var(--surface); border: 1px solid var(--line); color: var(--ink-sub); }
.edit-save { background: var(--ink); border: 1px solid var(--ink); color: #fff; }

.empty-msg {
grid-column: 1 / -1;
font-size: 13px; color: var(--ink-sub); text-align: center; padding: 40px 0;
}

#loadingScreen {
position: fixed; inset: 0; background: var(--bg);
display: flex; align-items: center; justify-content: center;
z-index: 100; flex-direction: column; gap: 14px;
}
#loadingScreen.hidden { display: none; }
.spinner {
width: 32px; height: 32px;
border: 3px solid var(--line); border-top-color: var(--accent);
border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--ink-sub); }
</style>
</head>
<body>

<div id="loadingScreen">
<div class="spinner"></div>
<div class="loading-text">読み込み中…</div>
</div>

<main id="mainWrap" style="display:none;">
<div class="sticky-header">
<div class="top-bar">
<select class="month-select" id="monthSelect"></select>
<span>確認状況　<span class="num" id="checkedCount">0</span> / <span id="totalCount">0</span> 件</span>
<span class="user-name" id="loginName">-</span>
</div>

<div class="filter-split">
<div class="seg-group" id="checkFilterRow"></div>
<div class="seg-group" id="typeFilterRow"></div>
</div>

<div class="day-row-wrap">
<button class="day-reset" id="addItemBtn" title="新規追加" aria-label="新規追加">＋</button>
<button class="day-reset" id="dayReset" title="全部表示" aria-label="全部表示">↺</button>
<div class="day-row" id="dayRow"></div>
</div>

<button class="bulk-check-btn" id="bulkCheckBtn">☑ 表示中を全てチェック</button>
</div>

<div class="item-list" id="itemList">
<div class="empty-msg">読み込み中…</div>
</div>
</main>

<script>
const LIFF_ID = '2010311386-JESD3mi6';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbWpg2TTkv7VQI38dNYWMSKZ2uO3ru-1Q1Cjze0UxS4MSF24Ahlt53jOam-XMB51dhWg/exec';

let lineUserId = '';
let displayName = '';
let currentMonth = '';
let allItems = [];
let checkFilter = 'all';   // 'all' | 'unchecked' | 'checked'
let typeFilter  = 'all';   // 'all' | 種別名
let dayFilter   = new Set(); // 選択中の「日」（空なら全部表示）
let editingRow  = null; // 現在編集中の行番号
let addMode     = false; // 新規追加フォームを開いているか

const $ = id => document.getElementById(id);
const loadingScreen = $('loadingScreen');
const mainWrap       = $('mainWrap');

(async () => {
try {
await liff.init({ liffId: LIFF_ID });
if (!liff.isLoggedIn()) { liff.login(); return; }
const profile = await liff.getProfile();
lineUserId  = profile.userId;
displayName = profile.displayName;
} catch(e) {
console.error('LIFF init error:', e);
lineUserId  = 'debug_user';
displayName = 'デバッグユーザー';
}
$('loginName').textContent = displayName;

await loadView();
loadingScreen.classList.add('hidden');
mainWrap.style.display = 'flex';
mainWrap.style.flexDirection = 'column';
})();

async function loadView(month) {
try {
const url = `${GAS_URL}?mode=view&uid=${encodeURIComponent(lineUserId)}` + (month ? `&sheetName=${encodeURIComponent(month)}` : '');
const res  = await fetch(url);
const data = await res.json();

if (data.status !== 'ok') {
$('itemList').innerHTML = '<div class="empty-msg">読み込みに失敗しました</div>';
return;
}

if (!data.hasInvoice) {
$('monthSelect').innerHTML = '';
$('checkFilterRow').innerHTML = '';
$('typeFilterRow').innerHTML = '';
$('dayRow').innerHTML = '';
$('itemList').innerHTML = `<div class="empty-msg">${data.reason || 'まだ請求書が用意されていません'}</div>`;
$('checkedCount').textContent = '0';
$('totalCount').textContent = '0';
return;
}

currentMonth = data.selectedMonth;
allItems = sortByDate(data.items || []);
dayFilter = new Set();
renderMonthSelect(data.months, data.selectedMonth);
renderCheckFilter();
renderTypeFilter();
renderDayRow();
applyFiltersAndRender();
} catch(err) {
console.error('loadViewエラー', err);
$('itemList').innerHTML = '<div class="empty-msg">読み込みに失敗しました</div>';
}
}

// 日付「2026/07/01」「6/4」どちらの形式にも対応して {month, day} を取り出す
function parseDateParts(dateStr) {
const s = String(dateStr || '');
let m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
if (m) return { year: Number(m[1]), month: Number(m[2]), day: Number(m[3]) };
m = s.match(/^(\d{1,2})\/(\d{1,2})/);
if (m) return { year: null, month: Number(m[1]), day: Number(m[2]) };
return null;
}

function dateSortKey(dateStr) {
const p = parseDateParts(dateStr);
if (!p) return 999999;
return p.month * 100 + p.day;
}

function sortByDate(items) {
return items.slice().sort((a, b) => dateSortKey(a.date) - dateSortKey(b.date));
}

function renderMonthSelect(months, selected) {
const select = $('monthSelect');
select.innerHTML = months.map(m =>
`<option value="${m}" ${m === selected ? 'selected' : ''}>${m}</option>`
).join('');

select.onchange = async () => {
$('itemList').innerHTML = '<div class="empty-msg">読み込み中…</div>';
await loadView(select.value);
};
}

function renderCheckFilter() {
const options = [
{ key: 'all', label: 'ALL' },
{ key: 'unchecked', label: '未□' },
{ key: 'checked', label: '済✓' },
];
$('checkFilterRow').innerHTML = options.map(o =>
`<button class="seg-btn ${checkFilter === o.key ? 'active' : ''}" data-check="${o.key}">${o.label}</button>`
).join('');

document.querySelectorAll('[data-check]').forEach(btn => {
btn.addEventListener('click', () => {
checkFilter = btn.dataset.check;
document.querySelectorAll('[data-check]').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
dayFilter = new Set();
renderDayRow();
applyFiltersAndRender();
});
});
}

function shortTypeLabel(t) {
if (t === 'その他人件費') return 'その他';
return t;
}

function renderTypeFilter() {
const types = Array.from(new Set(allItems.map(i => i.type).filter(Boolean)));
const options = ['all', ...types];
$('typeFilterRow').innerHTML = options.map(t =>
`<button class="seg-btn ${typeFilter === t ? 'active' : ''}" data-type="${t}">${t === 'all' ? 'ALL' : shortTypeLabel(t)}</button>`
).join('');

document.querySelectorAll('[data-type]').forEach(btn => {
btn.addEventListener('click', () => {
typeFilter = btn.dataset.type;
document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
dayFilter = new Set();
renderDayRow();
applyFiltersAndRender();
});
});
}

function getTypeCheckFilteredItems() {
let items = allItems;
if (checkFilter === 'unchecked') items = items.filter(i => !i.checked);
if (checkFilter === 'checked')   items = items.filter(i => i.checked);
if (typeFilter !== 'all') items = items.filter(i => i.type === typeFilter);
return items;
}

function renderDayRow() {
const source = getTypeCheckFilteredItems();
const days = Array.from(new Set(
source.map(i => { const p = parseDateParts(i.date); return p ? p.day : null; }).filter(Boolean)
)).sort((a, b) => a - b);

$('dayRow').innerHTML = days.map(d =>
`<span class="day-chip ${dayFilter.has(d) ? 'active' : ''}" data-day="${d}">${d}</span>`
).join('');

document.querySelectorAll('.day-chip').forEach(chip => {
chip.addEventListener('click', () => {
const d = Number(chip.dataset.day);
if (dayFilter.has(d)) dayFilter.delete(d); else dayFilter.add(d);
chip.classList.toggle('active');
applyFiltersAndRender();
});
});
}

$('dayReset').addEventListener('click', () => {
dayFilter = new Set();
renderDayRow();
applyFiltersAndRender();
});

$('addItemBtn').addEventListener('click', () => {
addMode = !addMode;
applyFiltersAndRender();
});

$('bulkCheckBtn').addEventListener('click', () => bulkCheckVisible());

function getFilteredItems() {
let items = getTypeCheckFilteredItems();
if (dayFilter.size > 0) {
items = items.filter(i => {
const p = parseDateParts(i.date);
return p && dayFilter.has(p.day);
});
}
return items;
}

function applyFiltersAndRender() {
renderItems(getFilteredItems());
}

async function bulkCheckVisible() {
const visible = getFilteredItems().filter(i => !i.checked);
if (visible.length === 0) return;

visible.forEach(i => { i.checked = true; });
applyFiltersAndRender();

try {
await Promise.all(visible.map(i => fetch(GAS_URL, {
method:   'POST',
redirect: 'follow',
headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
uid: lineUserId,
sheetName: currentMonth,
row: i.row,
checked: true,
}),
})));
} catch(err) {
console.error('まとめてチェックエラー', err);
}
}

function renderItems(items) {
const list = $('itemList');

const addHtml = addMode ? addCardHtml() : '';

if ((!items || items.length === 0) && !addMode) {
list.innerHTML = '<div class="empty-msg">該当する明細はありません</div>';
updateProgress();
return;
}

list.innerHTML = addHtml + (items && items.length ? items.map(itemCardHtml).join('') : '');
updateProgress();

list.querySelectorAll('.item-card:not(.editing)').forEach(card => {
card.addEventListener('click', () => onToggleItem(card));
});

list.querySelectorAll('.edit-icon-btn').forEach(btn => {
btn.addEventListener('click', (ev) => {
ev.stopPropagation();
editingRow = btn.dataset.editRow;
applyFiltersAndRender();
});
});

list.querySelectorAll('.edit-cancel').forEach(btn => {
btn.addEventListener('click', (ev) => {
ev.stopPropagation();
editingRow = null;
applyFiltersAndRender();
});
});

list.querySelectorAll('.edit-save').forEach(btn => {
btn.addEventListener('click', (ev) => {
ev.stopPropagation();
saveEdits(btn.dataset.row);
});
});

const addCancelBtn = $('addCancelBtn');
if (addCancelBtn) addCancelBtn.addEventListener('click', (ev) => {
ev.stopPropagation();
addMode = false;
applyFiltersAndRender();
});

const addSaveBtn = $('addSaveBtn');
if (addSaveBtn) addSaveBtn.addEventListener('click', (ev) => {
ev.stopPropagation();
saveNewItem();
});
}

const WEEKDAY_JP = ['日','月','火','水','木','金','土'];
function pad2(n) { return String(n).padStart(2, '0'); }

function fmtDateWithWeekday(dateStr) {
const p = parseDateParts(dateStr);
if (!p) return dateStr || '';
let year = p.year;
if (!year && currentMonth) {
const m = String(currentMonth).match(/^(\d{4})\./);
if (m) year = Number(m[1]);
}
if (!year) return `${pad2(p.month)}/${pad2(p.day)}`;
const d = new Date(year, p.month - 1, p.day);
return `${pad2(p.month)}/${pad2(p.day)}(${WEEKDAY_JP[d.getDay()]})`;
}

function fmtHours(h) {
if (h === '' || h === null || h === undefined) return '-';
const n = Number(h);
if (isNaN(n)) return String(h);
return n.toFixed(2);
}

function itemCardHtml(item) {
if (String(item.row) === String(editingRow)) return editCardHtml(item);

return `
<div class="item-card ${item.checked ? 'checked' : ''}" data-row="${item.row}" data-checked="${item.checked}">
<div class="item-main-row">
<div class="item-checkbox ${item.checked ? 'checked' : ''}">✓</div>
<div class="item-body">
<div class="item-top">
<span class="item-project"><span class="item-date">${fmtDateWithWeekday(item.date)}</span>${item.project}</span>
</div>
<div class="item-cols">
<div class="item-col">
<span>ポジション：<span class="v">${item.position || '-'}</span></span>
<span>担当：<span class="v">${item.name || '-'}</span></span>
<span>開始：<span class="v">${item.start || '-'}</span></span>
<span>終了：<span class="v">${item.end || '-'}</span></span>
<span>稼働：<span class="v">${fmtHours(item.hours)}</span></span>
</div>
<div class="item-col">
<span>種別：<span class="v">${item.type || '-'}</span></span>
<span>数量：<span class="v">${item.qty || '-'}</span></span>
<span>メモ：<span class="v">${item.memo || '-'}</span></span>
<span>単価：<span class="v">¥${Number(item.unitPrice).toLocaleString()}</span></span>
<span>合計：<span class="v">¥${Number(item.amount).toLocaleString()}</span></span>
</div>
</div>
</div>
</div>
<button class="edit-icon-btn" data-edit-row="${item.row}">✎</button>
</div>`;
}

function editField(label, field, item) {
const val = field === 'unitPrice' ? item.unitPrice : (item[field] || '');
return `<label>${label}<input id="edit-${field}-${item.row}" type="text" value="${String(val).replace(/"/g,'&quot;')}"></label>`;
}

function editCardHtml(item) {
return `
<div class="item-card editing" data-row="${item.row}">
<div class="item-body" style="width:100%;">
<div class="edit-grid">
${editField('日付','date',item)}
${editField('種別','type',item)}
${editField('案件名','project',item)}
${editField('ポジション','position',item)}
${editField('担当','name',item)}
${editField('開始','start',item)}
${editField('終了','end',item)}
${editField('稼働','hours',item)}
${editField('数量','qty',item)}
${editField('単価','unitPrice',item)}
</div>
<div class="edit-grid" style="grid-template-columns:1fr;">
${editField('メモ','memo',item)}
</div>
<div class="edit-actions">
<button class="edit-cancel" data-row="${item.row}">キャンセル</button>
<button class="edit-save" data-row="${item.row}">保存する</button>
</div>
</div>
</div>`;
}

async function saveEdits(row) {
const item = allItems.find(i => String(i.row) === String(row));
if (!item) { editingRow = null; applyFiltersAndRender(); return; }

const fields = ['date','type','project','position','name','start','end','hours','qty','unitPrice','memo'];
const edits = {};
fields.forEach(f => {
const el = document.getElementById(`edit-${f}-${row}`);
if (!el) return;
const newVal = el.value;
const oldVal = f === 'unitPrice' ? item.unitPrice : (item[f] ?? '');
if (String(oldVal ?? '') !== String(newVal)) edits[f] = newVal;
});

editingRow = null;

if (Object.keys(edits).length === 0) {
applyFiltersAndRender();
return;
}

Object.assign(item, edits);
applyFiltersAndRender();

try {
await fetch(GAS_URL, {
method:   'POST',
redirect: 'follow',
headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
uid: lineUserId,
sheetName: currentMonth,
row: row,
action: 'edit',
edits: edits,
}),
});
} catch(err) {
console.error('編集保存エラー', err);
}
}

async function onToggleItem(card) {
const row = card.dataset.row;
const nextChecked = card.dataset.checked !== 'true';

// 楽観的UI更新（allItemsの状態も同期しておく）
card.dataset.checked = nextChecked;
card.classList.toggle('checked', nextChecked);
card.querySelector('.item-checkbox').classList.toggle('checked', nextChecked);
const target = allItems.find(i => String(i.row) === String(row));
if (target) target.checked = nextChecked;
updateProgress();

try {
await fetch(GAS_URL, {
method:   'POST',
redirect: 'follow',
headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
uid: lineUserId,
sheetName: currentMonth,
row: row,
checked: nextChecked,
}),
});
} catch(err) {
console.error('チェック更新エラー', err);
// 失敗時はロールバック
card.dataset.checked = !nextChecked;
card.classList.toggle('checked', !nextChecked);
card.querySelector('.item-checkbox').classList.toggle('checked', !nextChecked);
if (target) target.checked = !nextChecked;
updateProgress();
}
}

function addCardHtml() {
return `
<div class="item-card editing" id="addCard">
<div class="item-body" style="width:100%;">
<div class="edit-grid">
<label>日付<input id="new-date" type="text" placeholder="6/4(木)"></label>
<label>種別<input id="new-type" type="text" placeholder="人件費"></label>
<label>案件名<input id="new-project" type="text"></label>
<label>ポジション<input id="new-position" type="text"></label>
<label>担当<input id="new-name" type="text" value="${displayName || ''}"></label>

async function saveNewItem() {
const fields = ['date','type','project','position','name','start','end','hours','qty','unitPrice','memo'];
const data = {};
fields.forEach(f => {
const el = document.getElementById(`new-${f}`);
if (el) data[f] = el.value;
});

addMode = false;
$('itemList').innerHTML = '<div class="empty-msg">保存中…</div>';

try {
await fetch(GAS_URL, {
method:   'POST',
redirect: 'follow',
headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
uid: lineUserId,
sheetName: currentMonth,
action: 'add',
data: data,
}),
});
} catch(err) {
console.error('新規追加エラー', err);
}

await loadView(currentMonth);
}

function updateProgress() {
const checked = allItems.filter(i => i.checked).length;
$('checkedCount').textContent = checked;
$('totalCount').textContent = allItems.length;
}
</script>
