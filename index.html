<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>請求書チェック</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
--ink:       #1c1c1c;
--ink-sub:   #6e6e6e;
--surface:   #ffffff;
--bg:        #f0f0ef;
--line:      #dcdcdc;
--accent:    #333333;
--ok:        #2ec4b6;
--ng:        #e63946;
--radius:    10px;
}

html, body {
background: var(--bg);
color: var(--ink);
font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
font-size: 14px;
min-height: 100vh;
-webkit-tap-highlight-color: transparent;
}

main { padding: 10px 8px 32px; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

.sticky-header {
position: sticky; top: 0; z-index: 20;
background: var(--bg);
padding-top: 10px; padding-bottom: 6px;
display: flex; flex-direction: column; gap: 8px;
margin: -10px -8px 0; padding-left: 8px; padding-right: 8px;
}

.top-bar {
padding: 4px 2px;
display: flex;
justify-content: space-between;
align-items: center;
gap: 8px;
font-size: 12px;
font-weight: 600;
color: var(--ink-sub);
}
.top-bar .num { color: var(--ink); font-weight: 700; }
.top-bar .user-name { color: var(--ink-sub); font-weight: 700; white-space: nowrap; }
.month-select {
font-size: 13px; font-weight: 700; padding: 8px 10px;
border-radius: 6px; border: 1px solid var(--line);
background: var(--surface); color: var(--ink);
flex: 1 1 auto; max-width: 140px;
}

.filter-split { display: flex; gap: 6px; }
.seg-group {
flex: 1; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
}
.seg-btn {
flex: 1; text-align: center; font-size: 11px; font-weight: 700; padding: 7px 2px;
background: var(--surface); color: var(--ink-sub); border: none; cursor: pointer;
white-space: nowrap;
}
.seg-btn.active { background: var(--ink); color: #fff; }
.seg-btn + .seg-btn { border-left: 1px solid var(--line); }

.bulk-check-btn {
width: 100%; padding: 9px; font-size: 12px; font-weight: 700;
border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
color: var(--ink-sub); cursor: pointer;
}

.day-row-wrap { display: flex; align-items: center; gap: 6px; }
.day-reset {
flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 14px; border: 1px solid var(--line); background: var(--surface);
color: var(--ink-sub); cursor: pointer;
}
.day-row { display: flex; flex-wrap: nowrap; gap: 5px; overflow-x: auto; padding-bottom: 2px; flex: 1; min-width: 0; }
.day-chip {
flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 10.5px; font-weight: 700;
border: 1px solid var(--line); background: var(--surface); color: var(--ink-sub);
cursor: pointer;
}
.day-chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }

.item-list {
display: flex; flex-direction: column; gap: 6px;
}

.item-card {
background: var(--surface);
border: 0.5px solid var(--line);
border-radius: 8px;
padding: 8px 10px;
display: flex;
flex-direction: row;
align-items: stretch;
gap: 8px;
}
.item-card.checked { background: #eef7f6; border-color: #bfe6e2; }

.item-left-col {
flex: 0 0 28px;
display: flex; flex-direction: column; justify-content: space-between; align-items: center;
}

.item-checkbox {
width: 18px; height: 18px; flex: 0 0 18px;
border: 1.5px solid var(--line); border-radius: 5px;
background: var(--surface);
display: inline-flex; align-items: center; justify-content: center;
font-size: 12px; color: transparent;
cursor: pointer;
transition: all .1s;
}
.item-checkbox.checked { background: var(--ok); border-color: var(--ok); color: #fff; }

.edit-icon-btn {
flex: 0 0 auto;
width: 18px; height: 18px; border-radius: 5px;
display: inline-flex; align-items: center; justify-content: center;
font-size: 10px; color: var(--ink-sub);
background: var(--surface); border: 1px solid var(--line); cursor: pointer;
}

.item-right-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.item-row1 { display: flex; align-items: center; gap: 7px; line-height: 1.3; }
.item-type {
font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 20px;
background: var(--line); color: var(--ink-sub); flex: 0 0 auto;
}
.item-row1 .item-project { font-size: 13px; font-weight: 700; color: var(--ink); }

.item-row2 { display: flex; align-items: baseline; gap: 8px; line-height: 1.3; }
.item-row2 .item-date { font-size: 11px; color: var(--ink-sub); font-weight: 600; }
.item-row2 .item-name { font-size: 11px; color: var(--ink-sub); font-weight: 600; flex: 1; }
.item-row2 .item-amount { font-size: 12.5px; font-weight: 700; color: var(--ink); white-space: nowrap; }

.item-memo { font-size: 11px; color: var(--ink-sub); }
.item-memo .v { color: var(--ink); font-weight: 600; }
.item-cols { display: flex; gap: 14px; }
.item-col { flex: 1; display: flex; flex-direction: column; gap: 1px; font-size: 11px; color: var(--ink-sub); min-width: 0; }
.item-col .v { color: var(--ink); font-weight: 600; }

.item-card.editing { flex-direction: column; align-items: stretch; }
.edit-grid {
display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; margin-bottom: 8px;
}
.edit-grid label { font-size: 10px; color: var(--ink-sub); font-weight: 600; display: block; }
.edit-grid input, .edit-grid select {
width: 100%; margin-top: 2px; padding: 6px 7px; font-size: 12px;
border: 1px solid var(--line); border-radius: 6px; font-family: inherit; color: var(--ink);
background: var(--surface); appearance: auto;
}
.edit-grid input[readonly] { background: var(--bg); color: var(--ink-sub); }
.edit-grid select:disabled { color: var(--ink-sub); background: var(--bg); }
.edit-actions { display: flex; gap: 6px; }
.edit-actions button {
flex: 1; padding: 9px; font-size: 12px; font-weight: 700; border-radius: 7px; cursor: pointer;
}
.edit-cancel { background: var(--surface); border: 1px solid var(--line); color: var(--ink-sub); }
.edit-save { background: var(--ink); border: 1px solid var(--ink); color: #fff; }

.empty-msg {
grid-column: 1 / -1;
font-size: 13px; color: var(--ink-sub); text-align: center; padding: 40px 0;
}

#loadingScreen {
position: fixed; inset: 0; background: var(--bg);
display: flex; align-items: center; justify-content: center;
z-index: 100; flex-direction: column; gap: 14px;
}
#loadingScreen.hidden { display: none; }
.spinner {
width: 32px; height: 32px;
border: 3px solid var(--line); border-top-color: var(--accent);
border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--ink-sub); }
</style>
</head>
<body>

<div id="loadingScreen">
<div class="spinner"></div>
<div class="loading-text">読み込み中…</div>
</div>

<main id="mainWrap" style="display:none;">
<div class="sticky-header">
<div class="top-bar">
<select class="month-select" id="monthSelect"></select>
<span>確認状況　<span class="num" id="checkedCount">0</span> / <span id="totalCount">0</span> 件</span>
<span class="user-name" id="loginName">-</span>
</div>

<div class="filter-split">
<div class="seg-group" id="checkFilterRow"></div>
<div class="seg-group" id="typeFilterRow"></div>
</div>

<div class="day-row-wrap">
<button class="day-reset" id="addItemBtn" title="新規追加" aria-label="新規追加">＋</button>
<button class="day-reset" id="dayReset" title="全部表示" aria-label="全部表示">↺</button>
<div class="day-row" id="dayRow"></div>
</div>

<button class="bulk-check-btn" id="bulkCheckBtn">☑ 表示中を全てチェック</button>
</div>

<div class="item-list" id="itemList">
<div class="empty-msg">読み込み中…</div>
</div>
</main>

<script>
const LIFF_ID = '2010311386-JESD3mi6';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbWpg2TTkv7VQI38dNYWMSKZ2uO3ru-1Q1Cjze0UxS4MSF24Ahlt53jOam-XMB51dhWg/exec';

let lineUserId = '';
let displayName = '';
let currentMonth = '';
let allItems = [];
let checkFilter = 'all';   // 'all' | 'unchecked' | 'checked'
let typeFilter  = new Set(); // 選択中の種別(空なら全種別を表示)
let dayFilter   = new Set(); // 選択中の「日」（空なら全部表示）
let editingRow  = null; // 現在編集中の行番号
let addMode     = false; // 新規追加フォームを開いているか

const $ = id => document.getElementById(id);
const loadingScreen = $('loadingScreen');
const mainWrap       = $('mainWrap');

(async () => {
try {
await liff.init({ liffId: LIFF_ID });
if (!liff.isLoggedIn()) { liff.login(); return; }
const profile = await liff.getProfile();
lineUserId  = profile.userId;
displayName = profile.displayName;
} catch(e) {
console.error('LIFF init error:', e);
lineUserId  = 'debug_user';
displayName = 'デバッグユーザー';
}
$('loginName').textContent = displayName;

await loadView();
loadingScreen.classList.add('hidden');
mainWrap.style.display = 'flex';
mainWrap.style.flexDirection = 'column';
})();

async function loadView(month) {
try {
const cacheBust = `&_=${Date.now()}`;
const url = `${GAS_URL}?mode=view&uid=${encodeURIComponent(lineUserId)}` + (month ? `&sheetName=${encodeURIComponent(month)}` : '') + cacheBust;
const res  = await fetch(url, { cache: 'no-store' });
const data = await res.json();

if (data.status !== 'ok') {
$('itemList').innerHTML = '<div class="empty-msg">読み込みに失敗しました</div>';
return;
}

if (!data.hasInvoice) {
$('monthSelect').innerHTML = '';
$('checkFilterRow').innerHTML = '';
$('typeFilterRow').innerHTML = '';
$('dayRow').innerHTML = '';
$('itemList').innerHTML = `<div class="empty-msg">${data.reason || 'まだ請求書が用意されていません'}</div>`;
$('checkedCount').textContent = '0';
$('totalCount').textContent = '0';
return;
}

currentMonth = data.selectedMonth;
allItems = sortByDate(data.items || []);
dayFilter = new Set();
renderMonthSelect(data.months, data.selectedMonth);
renderCheckFilter();
renderTypeFilter();
renderDayRow();
applyFiltersAndRender();
} catch(err) {
console.error('loadViewエラー', err);
$('itemList').innerHTML = '<div class="empty-msg">読み込みに失敗しました</div>';
}
}

// 日付「2026/07/01」「6/4」どちらの形式にも対応して {month, day} を取り出す
function parseDateParts(dateStr) {
const s = String(dateStr || '');
let m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
if (m) return { year: Number(m[1]), month: Number(m[2]), day: Number(m[3]) };
m = s.match(/^(\d{1,2})\/(\d{1,2})/);
if (m) return { year: null, month: Number(m[1]), day: Number(m[2]) };
return null;
}

function dateSortKey(dateStr) {
const p = parseDateParts(dateStr);
if (!p) return 999999;
return p.month * 100 + p.day;
}

function sortByDate(items) {
return items.slice().sort((a, b) => dateSortKey(a.date) - dateSortKey(b.date));
}

function renderMonthSelect(months, selected) {
const select = $('monthSelect');
select.innerHTML = months.map(m =>
`<option value="${m}" ${m === selected ? 'selected' : ''}>${m}</option>`
).join('');

select.onchange = async () => {
$('itemList').innerHTML = '<div class="empty-msg">読み込み中…</div>';
await loadView(select.value);
};
}

function renderCheckFilter() {
const options = [
{ key: 'all', label: 'ALL' },
{ key: 'unchecked', label: '未□' },
{ key: 'checked', label: '済✓' },
];
$('checkFilterRow').innerHTML = options.map(o =>
`<button class="seg-btn ${checkFilter === o.key ? 'active' : ''}" data-check="${o.key}">${o.label}</button>`
).join('');

document.querySelectorAll('[data-check]').forEach(btn => {
btn.addEventListener('click', () => {
checkFilter = btn.dataset.check;
document.querySelectorAll('[data-check]').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
dayFilter = new Set();
renderDayRow();
applyFiltersAndRender();
});
});
}

function shortTypeLabel(t) {
if (t === 'その他人件費') return 'その他';
return t;
}

function renderTypeFilter() {
const types = Array.from(new Set(allItems.map(i => i.type).filter(Boolean)));

let html = `<button class="seg-btn ${typeFilter.size === 0 ? 'active' : ''}" data-type="all">ALL</button>`;
html += types.map(t =>
`<button class="seg-btn ${typeFilter.has(t) ? 'active' : ''}" data-type="${t}">${shortTypeLabel(t)}</button>`
).join('');
$('typeFilterRow').innerHTML = html;

document.querySelectorAll('[data-type]').forEach(btn => {
btn.addEventListener('click', () => {
const t = btn.dataset.type;
if (t === 'all') {
typeFilter = new Set();
} else if (typeFilter.has(t)) {
typeFilter.delete(t);
} else {
typeFilter.add(t);
}
renderTypeFilter();
dayFilter = new Set();
renderDayRow();
applyFiltersAndRender();
});
});
}

function getTypeCheckFilteredItems() {
let items = allItems;
if (checkFilter === 'unchecked') items = items.filter(i => !i.checked);
if (checkFilter === 'checked')   items = items.filter(i => i.checked);
if (typeFilter.size > 0) items = items.filter(i => typeFilter.has(i.type));
return items;
}

function renderDayRow() {
const source = getTypeCheckFilteredItems();
const days = Array.from(new Set(
source.map(i => { const p = parseDateParts(i.date); return p ? p.day : null; }).filter(Boolean)
)).sort((a, b) => a - b);

$('dayRow').innerHTML = days.map(d =>
`<span class="day-chip ${dayFilter.has(d) ? 'active' : ''}" data-day="${d}">${d}</span>`
).join('');

document.querySelectorAll('.day-chip').forEach(chip => {
chip.addEventListener('click', () => {
const d = Number(chip.dataset.day);
if (dayFilter.has(d)) dayFilter.delete(d); else dayFilter.add(d);
chip.classList.toggle('active');
applyFiltersAndRender();
});
});
}

$('dayReset').addEventListener('click', () => {
dayFilter = new Set();
renderDayRow();
applyFiltersAndRender();
});

$('addItemBtn').addEventListener('click', () => {
addMode = !addMode;
applyFiltersAndRender();
});

$('bulkCheckBtn').addEventListener('click', () => bulkCheckVisible());

function getFilteredItems() {
let items = getTypeCheckFilteredItems();
if (dayFilter.size > 0) {
items = items.filter(i => {
const p = parseDateParts(i.date);
return p && dayFilter.has(p.day);
});
}
return items;
}

function applyFiltersAndRender() {
renderItems(getFilteredItems());
}

async function bulkCheckVisible() {
const visible = getFilteredItems().filter(i => !i.checked);
if (visible.length === 0) return;

visible.forEach(i => { i.checked = true; });
applyFiltersAndRender();

try {
await Promise.all(visible.map(i => fetch(GAS_URL, {
method:   'POST',
redirect: 'follow',
headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
uid: lineUserId,
sheetName: currentMonth,
row: i.row,
checked: true,
}),
})));
} catch(err) {
console.error('まとめてチェックエラー', err);
}
}

function renderItems(items) {
const list = $('itemList');

const addHtml = addMode ? addCardHtml() : '';

if ((!items || items.length === 0) && !addMode) {
list.innerHTML = '<div class="empty-msg">該当する明細はありません</div>';
updateProgress();
return;
}

list.innerHTML = addHtml + (items && items.length ? items.map(itemCardHtml).join('') : '');
updateProgress();

list.querySelectorAll('.item-card:not(.editing)').forEach(card => {
card.addEventListener('click', () => onToggleItem(card));
});

list.querySelectorAll('.edit-icon-btn').forEach(btn => {
btn.addEventListener('click', (ev) => {
ev.stopPropagation();
editingRow = btn.dataset.editRow;
applyFiltersAndRender();
});
});

list.querySelectorAll('.edit-cancel').forEach(btn => {
btn.addEventListener('click', (ev) => {
ev.stopPropagation();
editingRow = null;
applyFiltersAndRender();
});
});

list.querySelectorAll('.edit-save').forEach(btn => {
btn.addEventListener('click', (ev) => {
ev.stopPropagation();
saveEdits(btn.dataset.row);
});
});

const addCancelBtn = $('addCancelBtn');
if (addCancelBtn) addCancelBtn.addEventListener('click', (ev) => {
ev.stopPropagation();
addMode = false;
applyFiltersAndRender();
});

const addSaveBtn = $('addSaveBtn');
if (addSaveBtn) addSaveBtn.addEventListener('click', (ev) => {
ev.stopPropagation();
saveNewItem();
});

if (addMode) setupAddFormListeners();
if (editingRow) setupEditFormListeners(editingRow);
}

const WEEKDAY_JP = ['日','月','火','水','木','金','土'];
function pad2(n) { return String(n).padStart(2, '0'); }

function fmtDateWithWeekday(dateStr) {
const p = parseDateParts(dateStr);
if (!p) return dateStr || '';
let year = p.year;
if (!year && currentMonth) {
const m = String(currentMonth).match(/^(\d{4})\./);
if (m) year = Number(m[1]);
}
if (!year) return `${pad2(p.month)}/${pad2(p.day)}`;
const d = new Date(year, p.month - 1, p.day);
return `${pad2(p.month)}/${pad2(p.day)}(${WEEKDAY_JP[d.getDay()]})`;
}

function fmtHours(h) {
if (h === '' || h === null || h === undefined) return '-';
const n = Number(h);
if (isNaN(n)) return String(h);
return n.toFixed(2);
}

function itemCardHtml(item) {
if (String(item.row) === String(editingRow)) return editCardHtml(item);

return `
<div class="item-card ${item.checked ? 'checked' : ''}" data-row="${item.row}" data-checked="${item.checked}">
<div class="item-left-col">
<div class="item-checkbox ${item.checked ? 'checked' : ''}">✓</div>
<button class="edit-icon-btn" data-edit-row="${item.row}">✎</button>
</div>
<div class="item-right-col">
<div class="item-row1">
<span class="item-type">${item.type || '-'}</span>
<span class="item-project">${item.project || '-'}</span>
</div>
<div class="item-row2">
<span class="item-date">${fmtDateWithWeekday(item.date)}</span>
<span class="item-name">${item.name || '-'}</span>
<span class="item-amount">¥${Number(item.amount).toLocaleString()}</span>
</div>
<div class="item-cols">
<div class="item-col">
<span>開始：<span class="v">${item.start || '-'}</span></span>
<span>終了：<span class="v">${item.end || '-'}</span></span>
<span>稼働：<span class="v">${fmtHours(item.hours)}</span></span>
</div>
<div class="item-col">
<span>ポジション：<span class="v">${item.position || '-'}</span></span>
<span>数量：<span class="v">${item.qty || '-'}</span></span>
<span>単価：<span class="v">¥${Number(item.unitPrice).toLocaleString()}</span></span>
</div>
</div>
<div class="item-memo">メモ：<span class="v">${item.memo || '-'}</span></div>
</div>
</div>`;
}

function isTimeLike(v) {
return /^\d{1,2}:\d{2}$/.test(String(v || '').trim());
}

function editCardHtml(item) {
const row = item.row;
const dateVal = toDateInputValue(item.date);
const priceVal = item.unitPrice ? '¥' + Number(item.unitPrice).toLocaleString() : '';
const startIsTime = isTimeLike(item.start);
const endIsTime = isTimeLike(item.end);
const hoursAuto = startIsTime && endIsTime;

return `
<div class="item-card editing" data-row="${row}">
<div class="item-body" style="width:100%;">
<div class="edit-grid">
<label>日付<input id="edit-date-${row}" type="date" value="${dateVal}"></label>
<label>種別<select id="edit-type-${row}">
${['人件費','その他人件費','手当','立替費','★人材管理費'].map(t =>
`<option value="${t}" ${item.type === t ? 'selected' : ''}>${t}</option>`
).join('')}
</select></label>
<label style="grid-column:1/-1;">案件名<select id="edit-project-${row}">
<option value="${item.project || ''}" selected>${item.project || '(未設定)'}</option>
</select></label>
<label>ポジション<input id="edit-position-${row}" type="text" value="${esc(item.position)}"></label>
<label>担当<input id="edit-name-${row}" type="text" value="${esc(item.name)}"></label>
<label>開始${startIsTime ? '' : '(時間形式以外)'}<input id="edit-start-${row}" type="${startIsTime ? 'time' : 'text'}" value="${esc(item.start)}"></label>
<label>終了${endIsTime ? '' : '(時間形式以外)'}<input id="edit-end-${row}" type="${endIsTime ? 'time' : 'text'}" value="${esc(item.end)}"></label>
<label>稼働${hoursAuto ? '(自動計算)' : ''}<input id="edit-hours-${row}" type="text" value="${esc(fmtHours(item.hours))}" ${hoursAuto ? 'readonly' : ''}></label>
<label>数量<input id="edit-qty-${row}" type="text" value="${esc(item.qty)}"></label>
<label>単価<input id="edit-unitPrice-${row}" type="text" value="${priceVal}" inputmode="numeric"></label>
</div>
<div class="edit-grid" style="grid-template-columns:1fr;">
<label>メモ<input id="edit-memo-${row}" type="text" value="${esc(item.memo)}"></label>
</div>
<div class="edit-actions">
<button class="edit-cancel" data-row="${row}">キャンセル</button>
<button class="edit-save" data-row="${row}">保存する</button>
</div>
</div>
</div>`;
}

function esc(v) {
return String(v ?? '').replace(/"/g, '&quot;');
}

// 保存済みの日付("M/D(曜)"や"yyyy/MM/dd")を <input type=date> 用の "yyyy-MM-dd" に変換
function toDateInputValue(dateStr) {
const p = parseDateParts(dateStr);
if (!p) return '';
let year = p.year;
if (!year && currentMonth) {
const m = String(currentMonth).match(/^(\d{4})\./);
if (m) year = Number(m[1]);
}
if (!year) return '';
return `${year}-${pad2(p.month)}-${pad2(p.day)}`;
}

// ---- 編集フォームの補助ロジック(新規追加フォームと同じ挙動) ----
function setupEditFormListeners(row) {
const dateEl = $(`edit-date-${row}`);
if (dateEl) dateEl.addEventListener('change', () => onEditDateChange(row));

const startEl = $(`edit-start-${row}`), endEl = $(`edit-end-${row}`);
if (startEl) startEl.addEventListener('change', () => updateEditAutoHours(row));
if (endEl) endEl.addEventListener('change', () => updateEditAutoHours(row));

const priceEl = $(`edit-unitPrice-${row}`);
if (priceEl) priceEl.addEventListener('input', formatCurrencyInput);
}

async function onEditDateChange(row) {
const dateEl = $(`edit-date-${row}`);
const projectEl = $(`edit-project-${row}`);
if (!dateEl || !projectEl || !dateEl.value) return;

const currentValue = projectEl.value;
projectEl.disabled = true;
projectEl.innerHTML = '<option value="">読み込み中…</option>';

try {
const res = await fetch(`${GAS_URL}?mode=projects&date=${encodeURIComponent(dateEl.value)}&_=${Date.now()}`, { cache: 'no-store' });
const data = await res.json();
const projects = data.projects || [];
if (currentValue && projects.indexOf(currentValue) === -1) projects.unshift(currentValue);
if (projects.length === 0) {
projectEl.innerHTML = '<option value="">この日の案件が見つかりません</option>';
} else {
projectEl.innerHTML = projects.map(p =>
`<option value="${p}" ${p === currentValue ? 'selected' : ''}>${p}</option>`
).join('');
}
} catch (err) {
console.error('案件取得エラー', err);
}
projectEl.disabled = false;
}

function updateEditAutoHours(row) {
const startEl = $(`edit-start-${row}`), endEl = $(`edit-end-${row}`), hoursEl = $(`edit-hours-${row}`);
if (!startEl || !endEl || !hoursEl) return;
if (!isTimeLike(startEl.value) || !isTimeLike(endEl.value)) return; // 時間形式でなければ自動計算しない

const [sh, sm] = startEl.value.split(':').map(Number);
const [eh, em] = endEl.value.split(':').map(Number);
let diffMin = (eh * 60 + em) - (sh * 60 + sm);
if (diffMin < 0) diffMin += 24 * 60;
hoursEl.value = (diffMin / 60).toFixed(2);
}

async function saveEdits(row) {
const item = allItems.find(i => String(i.row) === String(row));
if (!item) { editingRow = null; applyFiltersAndRender(); return; }

const dateEl = $(`edit-date-${row}`);
const newDate = dateEl && dateEl.value ? toSheetDateStr(dateEl.value) : item.date;

const priceEl = $(`edit-unitPrice-${row}`);
const newPrice = priceEl ? priceEl.value.replace(/[^\d]/g, '') : item.unitPrice;

const rawFields = { date: newDate, unitPrice: newPrice };
['type', 'project', 'position', 'name', 'start', 'end', 'hours', 'qty', 'memo'].forEach(f => {
const el = $(`edit-${f}-${row}`);
if (el) rawFields[f] = el.value;
});

const edits = {};
Object.keys(rawFields).forEach(f => {
const oldVal = f === 'unitPrice' ? item.unitPrice : (item[f] ?? '');
if (String(oldVal ?? '') !== String(rawFields[f])) edits[f] = rawFields[f];
});

editingRow = null;

if (Object.keys(edits).length === 0) {
applyFiltersAndRender();
return;
}

Object.assign(item, edits);

// ★楽観的に合計金額も先に再計算して即座に画面へ反映(サーバー確定値は
//   このあとの再取得で上書きされるので、ズレていてもすぐ直る)
if (edits.hasOwnProperty('qty') || edits.hasOwnProperty('unitPrice')) {
const q = Number(item.qty);
const u = Number(item.unitPrice);
if (!isNaN(q) && !isNaN(u)) item.amount = q * u;
}

applyFiltersAndRender();

try {
await fetch(GAS_URL, {
method:   'POST',
redirect: 'follow',
headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
uid: lineUserId,
sheetName: currentMonth,
row: row,
action: 'edit',
edits: edits,
}),
});
// ★保存後にサーバーから最新データを取り直す(合計金額など、サーバー側で
//   再計算された値をLIFF側にも正しく反映するため)
await loadView(currentMonth);
} catch (err) {
console.error('編集保存エラー', err);
}
}

async function onToggleItem(card) {
const row = card.dataset.row;
const nextChecked = card.dataset.checked !== 'true';

// 楽観的UI更新（allItemsの状態も同期しておく）
card.dataset.checked = nextChecked;
card.classList.toggle('checked', nextChecked);
card.querySelector('.item-checkbox').classList.toggle('checked', nextChecked);
const target = allItems.find(i => String(i.row) === String(row));
if (target) target.checked = nextChecked;
updateProgress();

try {
await fetch(GAS_URL, {
method:   'POST',
redirect: 'follow',
headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
uid: lineUserId,
sheetName: currentMonth,
row: row,
checked: nextChecked,
}),
});
} catch(err) {
console.error('チェック更新エラー', err);
// 失敗時はロールバック
card.dataset.checked = !nextChecked;
card.classList.toggle('checked', !nextChecked);
card.querySelector('.item-checkbox').classList.toggle('checked', !nextChecked);
if (target) target.checked = !nextChecked;
updateProgress();
}
}

// ---- 新規追加フォームの補助ロジック ----
function setupAddFormListeners() {
const dateEl = $('new-date');
if (dateEl) dateEl.addEventListener('change', onAddDateChange);

const startEl = $('new-start'), endEl = $('new-end');
if (startEl) startEl.addEventListener('change', updateAutoHours);
if (endEl) endEl.addEventListener('change', updateAutoHours);

const priceEl = $('new-unitPrice');
if (priceEl) priceEl.addEventListener('input', formatCurrencyInput);
}

// 日付を選ぶと、クベーラ(全国版JT)からその日の案件名を取得してプルダウンに反映
async function onAddDateChange() {
const dateEl = $('new-date');
const projectEl = $('new-project');
if (!dateEl || !projectEl || !dateEl.value) return;

projectEl.disabled = true;
projectEl.innerHTML = '<option value="">読み込み中…</option>';

try {
const res = await fetch(`${GAS_URL}?mode=projects&date=${encodeURIComponent(dateEl.value)}&_=${Date.now()}`, { cache: 'no-store' });
const data = await res.json();
const projects = data.projects || [];
if (projects.length === 0) {
projectEl.innerHTML = '<option value="">この日の案件が見つかりません</option>';
} else {
projectEl.innerHTML = '<option value="">選択してください</option>' +
projects.map(p => `<option value="${p}">${p}</option>`).join('');
}
} catch (err) {
console.error('案件取得エラー', err);
projectEl.innerHTML = '<option value="">取得に失敗しました</option>';
}
projectEl.disabled = false;
}

// 開始・終了時間から稼働時間を自動計算(HH:mm差分 → 小数)
function updateAutoHours() {
const startEl = $('new-start'), endEl = $('new-end'), hoursEl = $('new-hours');
if (!startEl || !endEl || !hoursEl) return;
if (!startEl.value || !endEl.value) { hoursEl.value = ''; return; }

const [sh, sm] = startEl.value.split(':').map(Number);
const [eh, em] = endEl.value.split(':').map(Number);
let diffMin = (eh * 60 + em) - (sh * 60 + sm);
if (diffMin < 0) diffMin += 24 * 60; // 日をまたぐケース
hoursEl.value = (diffMin / 60).toFixed(2);
}

// 単価入力を ¥00,000 形式に整形
function formatCurrencyInput(ev) {
const el = ev.target;
const digits = el.value.replace(/[^\d]/g, '');
el.value = digits ? '¥' + Number(digits).toLocaleString() : '';
}

// メモ = 手入力キーワード + 選択した案件名(自動反映)
function buildAutoMemo() {
const keywordEl = $('new-memoKeyword');
const projectEl = $('new-project');
const parts = [];
if (keywordEl && keywordEl.value.trim()) parts.push(keywordEl.value.trim());
if (projectEl && projectEl.value) parts.push(projectEl.value);
return parts.join(' ');
}

// "yyyy-MM-dd" → "M/D(曜)" 形式(シート上の既存表記に合わせる)
function toSheetDateStr(yyyyMMdd) {
if (!yyyyMMdd) return '';
const [y, m, d] = yyyyMMdd.split('-').map(Number);
const dt = new Date(y, m - 1, d);
return `${m}/${d}(${WEEKDAY_JP[dt.getDay()]})`;
}

async function saveNewItem() {
const dateVal = $('new-date') ? $('new-date').value : '';
const unitPriceRaw = $('new-unitPrice') ? $('new-unitPrice').value.replace(/[^\d]/g, '') : '';

const data = {
date:      toSheetDateStr(dateVal),
type:      $('new-type')     ? $('new-type').value     : '',
project:   $('new-project')  ? $('new-project').value  : '',
position:  $('new-position') ? $('new-position').value : '',
name:      $('new-name')     ? $('new-name').value     : '',
start:     $('new-start')    ? $('new-start').value    : '',
end:       $('new-end')      ? $('new-end').value      : '',
hours:     $('new-hours')    ? $('new-hours').value    : '',
qty:       $('new-qty')      ? $('new-qty').value      : '',
unitPrice: unitPriceRaw,
memo:      buildAutoMemo(),
};

addMode = false;
$('itemList').innerHTML = '<div class="empty-msg">保存中…</div>';

try {
await fetch(GAS_URL, {
method:   'POST',
redirect: 'follow',
headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({
uid: lineUserId,
sheetName: currentMonth,
action: 'add',
data: data,
}),
});
} catch(err) {
console.error('新規追加エラー', err);
}

await loadView(currentMonth);
}

function updateProgress() {
const checked = allItems.filter(i => i.checked).length;
$('checkedCount').textContent = checked;
$('totalCount').textContent = allItems.length;
}
